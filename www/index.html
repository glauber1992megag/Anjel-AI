<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17131f">
  <title>Anjel AI</title>
  <style>
    :root{color-scheme:dark;--bg:#17131f;--panel:#211a31;--accent:#9b6cf4;--muted:#c9bdd7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;flex-direction:column}
    header{padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;background:var(--panel);border-bottom:1px solid #5b3e82}
    header h1{margin:0;color:#d7b4ff;font-size:24px}
    header p{margin:4px 0 0;color:var(--muted);font-size:12px}
    #apiBox{margin:12px;background:var(--panel);padding:14px;border-radius:18px}
    input{min-width:0;border:1px solid #403451;outline:none;background:var(--bg);color:#fff;padding:13px;border-radius:14px;font-size:16px}
    input:focus{border-color:var(--accent)}
    #apiKey{width:100%;margin:10px 0}
    button{border:0;color:#fff;background:var(--accent);padding:12px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #saveKey{width:100%}
    .hint{font-size:11px;color:var(--muted);line-height:1.5;margin:9px 0 0}
    .examples{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:thin}
    .examples button{white-space:nowrap;background:#302441}
    #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
    .msg{max-width:95%;padding:12px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-end;background:#7c3aed;border-bottom-right-radius:5px}
    .ai{align-self:flex-start;background:var(--panel);border:1px solid #332847;border-bottom-left-radius:5px}
    .typing{opacity:.75;font-style:italic}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .actions button{padding:9px 11px}
    #inputArea{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel)}
    #prompt{flex:1;border-radius:24px}
    #send{width:50px;height:50px;border-radius:50%;font-size:20px;padding:0;flex:none}
    #previewDialog{padding:0;border:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:#100d17;color:white}
    #previewDialog::backdrop{background:#000}
    #previewToolbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--panel)}
    #previewFrame{display:block;width:100%;height:calc(100dvh - 56px);border:0;background:white}
    @media(min-width:700px){.msg{max-width:85%}}
  </style>
</head>
<body>
  <header>
    <h1>✦ Anjel AI</h1>
    <p>Seu cantinho criativo para transformar ideias em programas</p>
  </header>

  <section id="apiBox">
    <strong>🔑 Chave da Gemini</strong>
    <input id="apiKey" type="password" placeholder="Cole sua API Key aqui" autocomplete="off" aria-label="Chave da API Gemini">
    <button id="saveKey" type="button">Salvar e ativar</button>
    <p class="hint">A chave fica guardada neste aparelho. Não a compartilhe nem a publique no GitHub. Para um aplicativo distribuído publicamente, use um backend para proteger a chave.</p>
  </section>

  <nav class="examples" aria-label="Ideias para começar">
    <button type="button" data-prompt="Crie um jogo da cobrinha completo">🐍 Jogo da Cobrinha</button>
    <button type="button" data-prompt="Crie uma calculadora moderna">🧮 Calculadora</button>
    <button type="button" data-prompt="Crie um site de loja de roupas">👕 Loja</button>
    <button type="button" data-prompt="Crie um app de lista de tarefas">✅ Tarefas</button>
    <button type="button" data-prompt="Crie um jogo da memória">🎮 Memória</button>
  </nav>

  <main id="chat" aria-live="polite"></main>

  <form id="inputArea">
    <input id="prompt" placeholder="Converse ou peça um programa..." autocomplete="off" aria-label="Escreva uma mensagem">
    <button id="send" type="submit" aria-label="Enviar">➤</button>
  </form>

  <dialog id="previewDialog" aria-label="Prévia do programa">
    <div id="previewToolbar"><strong>Prévia do programa</strong><button id="closePreview" type="button">Fechar ✕</button></div>
    <iframe id="previewFrame" title="Prévia do programa criado" sandbox="allow-scripts"></iframe>
  </dialog>

  <script>
    const apiBox = document.getElementById('apiBox');
    const apiKeyInput = document.getElementById('apiKey');
    const promptInput = document.getElementById('prompt');
    const chat = document.getElementById('chat');
    const sendButton = document.getElementById('send');
    const previewDialog = document.getElementById('previewDialog');
    const previewFrame = document.getElementById('previewFrame');
    const MODEL = 'gemini-3.8-flash';
    const REQUEST_TIMEOUT_MS = 60000;
    const HISTORY_LIMIT = 20;
    let apiKey = localStorage.getItem('anjel_key') || '';
    let history = [];

    try { history = JSON.parse(localStorage.getItem('anjel_chat') || '[]'); } catch { history = []; }
    if (!Array.isArray(history)) history = [];

    function addMessage(text, className) {
      const element = document.createElement('div');
      element.className = 'msg ' + className;
      element.textContent = text;
      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      return element;
    }

    function renderHistory() {
      chat.replaceChildren();
      if (!history.length) {
        addMessage('Olá! Eu sou a Anjel AI 🤖✨\n\nPosso conversar com você, responder perguntas e ajudar a criar programas. O que vamos fazer hoje?', 'ai');
        return;
      }
      for (const turn of history) addMessage(turn.role === 'user' ? turn.parts?.[0]?.text || '' : turn.parts?.[0]?.text || '', turn.role === 'user' ? 'user' : 'ai');
    }

    function saveHistory() {
      history = history.slice(-HISTORY_LIMIT);
      localStorage.setItem('anjel_chat', JSON.stringify(history));
    }

    if (apiKey) {
      apiKeyInput.value = apiKey;
      apiBox.hidden = true;
    }
    renderHistory();

    document.getElementById('saveKey').addEventListener('click', () => {
      const value = apiKeyInput.value.trim();
      if (!value) return alert('Cole sua chave da Gemini primeiro.');
      apiKey = value;
      localStorage.setItem('anjel_key', apiKey);
      apiBox.hidden = true;
      alert('Chave salva neste aparelho. Você já pode conversar com a Anjel AI! ✨');
    });

    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => {
        promptInput.value = button.dataset.prompt;
        sendMessage();
      });
    });

    document.getElementById('inputArea').addEventListener('submit', event => {
      event.preventDefault();
      sendMessage();
    });

    document.getElementById('closePreview').addEventListener('click', () => previewDialog.close());
    previewDialog.addEventListener('close', () => { previewFrame.srcdoc = ''; });

    function addProgramActions(message, code) {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const previewButton = document.createElement('button');
      previewButton.type = 'button';
      previewButton.textContent = '👀 Abrir prévia em tela cheia';
      const downloadButton = document.createElement('button');
      downloadButton.type = 'button';
      downloadButton.textContent = '⬇ Baixar HTML';
      const copyButton = document.createElement('button');
      copyButton.type = 'button';
      copyButton.textContent = '📋 Copiar código';
      previewButton.addEventListener('click', () => {
        previewFrame.srcdoc = code;
        previewDialog.showModal();
      });
      downloadButton.addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([code], { type: 'text/html;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'programa-anjel-ai.html';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          alert('Código copiado! 📋');
        } catch { alert('Não foi possível copiar. Use o botão Baixar HTML.'); }
      });
      actions.append(previewButton, downloadButton, copyButton);
      message.append(actions);
    }

    async function sendMessage() {
      const text = promptInput.value.trim();
      if (!text || sendButton.disabled) return;
      if (!apiKey) {
        apiBox.hidden = false;
        apiKeyInput.focus();
        alert('Cole e salve sua chave da Gemini primeiro.');
        return;
      }

      const priorHistory = history.slice(-HISTORY_LIMIT);
      history.push({ role: 'user', parts: [{ text }] });
      saveHistory();
      addMessage(text, 'user');
      promptInput.value = '';
      const loading = addMessage('Anjel AI está pensando… ⏳', 'ai typing');
      sendButton.disabled = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      const systemPrompt = 'Você é a Anjel AI, uma assistente conversacional amigável e útil. Responda em português, de forma natural, como em um chat. Continue o contexto da conversa. Não crie um programa ou código só porque o usuário cumprimentou ou fez uma pergunta comum. Se o usuário pedir explicitamente para criar um programa, jogo, página ou aplicativo, explique brevemente e inclua o programa completo em um único bloco ```html ... ``` que funcione sozinho no navegador. Se o pedido não estiver claro, faça uma pergunta curta para esclarecer.';

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [...priorHistory, { role: 'user', parts: [{ text }] }],
            generationConfig: { temperature: 0.7, maxOutputTokens: 4096 }
          }),
          signal: controller.signal
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error?.message || `Erro HTTP ${response.status}`);
        const answer = data.candidates?.[0]?.content?.parts?.map(part => part.text || '').join('').trim();
        if (!answer) throw new Error('A Gemini retornou uma resposta vazia. Tente novamente.');

        history.push({ role: 'model', parts: [{ text: answer }] });
        saveHistory();
        loading.remove();
        const match = answer.match(/```html\s*([\s\S]*?)```/i);
        const displayText = match ? answer.replace(match[0], '').trim() : answer;
        const message = addMessage(displayText || (match ? 'Programa criado! ✨' : answer), 'ai');
        if (match) addProgramActions(message, match[1].trim());
      } catch (error) {
        const reason = error.name === 'AbortError'
          ? 'A resposta demorou mais de 60 segundos. Verifique a conexão e tente novamente.'
          : error.message === 'Failed to fetch'
            ? 'Não consegui conectar à Gemini. Verifique a internet, a chave e a disponibilidade do serviço; tente enviar novamente.'
            : error.message;
        loading.textContent = 'Não consegui obter uma resposta: ' + reason;
        history = priorHistory;
        saveHistory();
      } finally {
        clearTimeout(timeoutId);
        sendButton.disabled = false;
        promptInput.focus();
      }
    }
  </script>
</body>
</html>
